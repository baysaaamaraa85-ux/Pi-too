services:
  db:
    image: postgres:16
    container_name: pitoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: pitoo
    ports:
      # Хост дээр 5432 порт өөр (Docker-той хамааралгүй) postgres процессод эзэмшигдсэн
      # тул 5440 ашиглана. Контейнер дотор 5432 хэвээр.
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Хөгжүүлэлтийн SMTP хавх: илгээсэн имэйл http://localhost:8025 дээр харагдана (ФШ-05, 61).
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: pitoo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
